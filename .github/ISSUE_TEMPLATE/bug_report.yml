name: Bug report
description: Something does not work as the README describes.
labels: [bug]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: GitLab Runner version
      placeholder: "19.5.2"
    validations:
      required: true
  - type: input
    id: cloud
    attributes:
      label: OpenStack release or cloud
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: plugin_config
      description: Without credentials.
      render: toml
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Runner logs
      render: text
